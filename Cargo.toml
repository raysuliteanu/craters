[package]
name = "craters"
version = "0.1.0"
edition = "2024"
description = "TUI for crates.io"
authors = ["Ray Suliteanu <raysuliteanu@pm.me>"]
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
crates_io_api = "0.12.0"
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
log = "0.4.28"
ratatui = { version = "0.29.0", features = ["all-widgets"] }
simplelog = "0.12.2"
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
unicode-width = "0.2.0"
better-panic = "0.3.0"
derive_deref = "1.1.1"
directories = "6.0.0"
futures = "0.3.31"
human-panic = "2.0.2"
json5 = "0.4.1"
lazy_static = "1.5.0"
libc = "0.2.161"
pretty_assertions = "1.4.1"
serde = { version = "1.0.211", features = ["derive"] }
serde_json = "1.0.132"
signal-hook = "0.3.17"
strip-ansi-escapes = "0.2.0"
tokio-util = "0.7.12"
tracing = "0.1.40"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "serde"] }
config = "0.15.18"
color-eyre = "0.6.5"

[build-dependencies]
anyhow = "1.0.90"
vergen-gix = { version = "1.0.2", features = ["build", "cargo"] }
